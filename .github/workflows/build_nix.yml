name: "Build Nix package on self-hosted runner"

on:
  push:

jobs:
  build:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      # nix is already on the runner's PATH — no install-nix-action needed
      - name: Building package
        run: nix build
      - name: Push to Attic
        run: |
          set -euo pipefail
          command -v attic >/dev/null || { echo "attic not installed; skipping"; exit 0; }
          XDG_CONFIG_HOME=/etc attic push 2143nix ./result || echo "::warning::attic push failed"
